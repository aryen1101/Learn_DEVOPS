apiVersion: v1
kind: Pod
metadata:
  name: secret-test
spec:
  restartPolicy: Never
  containers:
    - name: test
      image: busybox:1.36
      command: ["sh", "-c", "echo \"Password is: [$DB_PASSWORD]\"; echo -n \"Length: \"; printf '%s' \"$DB_PASSWORD\" | wc -c"]
      env:
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: db-secret
              key: DB_PASSWORD